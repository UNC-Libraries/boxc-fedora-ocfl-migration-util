name: Build

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Checkout custom fcrepo-import-export
        uses: actions/checkout@v6
        with:
          repository: UNC-Libraries/fcrepo-import-export
          ref: expose-api
          path: fcrepo-import-export

      - name: Install custom fcrepo-import-export
        run: mvn --batch-mode --update-snapshots -DskipTests install
        working-directory: fcrepo-import-export

      - name: Checkout custom fcrepo-upgrade-utils
        uses: actions/checkout@v6
        with:
          repository: fcrepo-exts/fcrepo-upgrade-utils
          ref: fcrepo-4116
          path: fcrepo-upgrade-utils

      - name: Install custom fcrepo-upgrade-utils
        run: mvn --batch-mode --update-snapshots -DskipTests install
        working-directory: fcrepo-upgrade-utils

      - name: Prepare Fedora storage
        run: |
          sudo mkdir -p /tmp/boxc_migration_storage/fedora7/{ocfl,staging,temp}
          sudo cp -R src/test/resources/external_binaries/. /tmp/boxc_migration_storage/
          sudo chmod -R a+rwx /tmp/boxc_migration_storage

      - name: Start disposable Fedora instances
        run: docker compose -f src/test/docker/docker-compose.yml up --detach --force-recreate

      - name: Run unit and integration tests
        run: mvn --batch-mode verify -Dfedora.managed.externally=true

      - name: Show Fedora logs
        if: failure()
        run: docker compose -f src/test/docker/docker-compose.yml logs --no-color

      - name: Remove disposable Fedora instances
        if: always()
        run: |
          docker compose -f src/test/docker/docker-compose.yml down --volumes --remove-orphans
          sudo rm -rf /tmp/boxc_migration_storage
