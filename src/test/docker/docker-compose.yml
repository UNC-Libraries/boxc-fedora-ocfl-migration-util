name: boxc-fedora-ocfl-migration-it

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: fcrepo
      POSTGRES_USER: fcrepo
      POSTGRES_PASSWORD: fcrepo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=fcrepo --dbname=fcrepo"]
      interval: 2s
      timeout: 5s
      retries: 30

  fcrepo5:
    image: fcrepo/fcrepo:5.1.1-multiplatform
    ports:
      - "8181:8080"
    volumes:
      - /tmp/boxc_migration_storage:/tmp/boxc_migration_storage
      - ./allowed-external-content.txt:/config/allowed-external-content.txt:ro
    environment:
      CATALINA_OPTS: >-
        -XX:-UseContainerSupport
        -Dfcrepo.external.content.allowed=/config/allowed-external-content.txt

  fcrepo7:
    image: fcrepo/fcrepo:7.1.0-SNAPSHOT
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "48087:8080"
    volumes:
      - /tmp/boxc_migration_storage:/tmp/boxc_migration_storage
      - ./allowed-external-content.txt:/config/allowed-external-content.txt:ro
      - ./fcrepo7/fcrepo.properties:/config/fcrepo.properties:ro
    environment:
      CATALINA_OPTS: >-
        -Dfcrepo.config.file=/config/fcrepo.properties
        -Dfcrepo.autoversioning.enabled=false
